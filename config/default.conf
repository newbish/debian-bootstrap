# Debian bootstrap defaults.
# Override at runtime with --user USER, CONFIG_USER=USER, or config/local.conf.
CONFIG_USER=debian

# Optional local override. This file is ignored by git.
if [[ -f "${BASH_SOURCE[0]%/*}/local.conf" ]]; then
  # shellcheck source=/dev/null
  source "${BASH_SOURCE[0]%/*}/local.conf"
fi
